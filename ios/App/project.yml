name: Coach
options:
  bundleIdPrefix: com.pathors
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  # The app ships in American English only — no second localization.
  developmentLanguage: en
# knownRegions drives which localizations `Localizable.xcstrings` /
# `InfoPlist.xcstrings` actually compile into the bundle.
knownRegions: [en, Base]
packages:
  CoachKit:
    path: ../CoachKit
targets:
  Coach:
    type: application
    platform: iOS
    sources: [Coach]
    dependencies:
      - package: CoachKit
      # Embeds the keyboard extension into the app bundle.
      - target: CoachKeyboard
    entitlements:
      path: Coach/Coach.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Shared with the keyboard extension: the dictation transcript handoff
        # lives in this App Group container (see DictationChannel).
        com.apple.security.application-groups: [group.com.saleshunter.coach.ios]
    info:
      path: Coach/Info.plist
      properties:
        CFBundleDisplayName: Coach
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        # Localized in Coach/InfoPlist.xcstrings; this is the fallback value.
        NSMicrophoneUsageDescription: Coach records the meeting in the room so it can transcribe it live. Audio goes only to the transcription provider tied to your account.
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.saleshunter.coach.ios.auth
            CFBundleURLSchemes: [saleshunter-coach]
        # The Pathors faces (see Coach/CoachTypography.swift). UIAppFonts is
        # all an app target needs — no runtime CTFontManager registration.
        # Deliberately absent from CoachKeyboard: the keyboard extension runs
        # under a hard memory cap and draws its own minimal UI.
        UIAppFonts:
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - Alexandria-SemiBold.ttf
          - Alexandria-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saleshunter.coach.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # 科技派斯 (Pathors). Xcode manages the certificate and profile; CI can
        # pass an App Store Connect API key with -allowProvisioningUpdates.
        DEVELOPMENT_TEAM: SXHVCQXJHZ

  CoachKeyboard:
    type: app-extension
    platform: iOS
    sources: [../Keyboard]
    dependencies:
      - package: CoachKit
    entitlements:
      path: ../Keyboard/CoachKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.saleshunter.coach.ios]
    info:
      path: ../Keyboard/Info.plist
      properties:
        # Localized in ../Keyboard/InfoPlist.xcstrings; this is the fallback.
        CFBundleDisplayName: Coach Voice
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "9"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            # Dictation is language-agnostic — the transcription provider
            # decides, not the key layout — so the keyboard declares itself
            # multilingual rather than Chinese-only, which is how it read to an
            # English user before.
            PrimaryLanguage: mul
            # Dictation streams audio to the Coach account for transcription,
            # so the keyboard needs Full Access (network + App Group). Without
            # it the keyboard still offers the minimal key row (App Review 4.4.1).
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saleshunter.coach.ios.keyboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SXHVCQXJHZ
