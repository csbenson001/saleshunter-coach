<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161a24"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="mark" x1="240" y1="200" x2="800" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Tile -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- SalesHunter Precision Radar Crosshair Ring -->
  <circle cx="512" cy="512" r="280" stroke="url(#mark)" stroke-width="40" stroke-opacity="0.45" stroke-dasharray="88 44" fill="none"/>
  
  <!-- Outer Hunter Corner Reticle Brackets -->
  <g stroke="url(#mark)" stroke-width="48" stroke-linecap="round" fill="none">
    <!-- Top-Left -->
    <path d="M300 240 H240 V300"/>
    <!-- Top-Right -->
    <path d="M724 240 H784 V300"/>
    <!-- Bottom-Left -->
    <path d="M300 784 H240 V724"/>
    <!-- Bottom-Right -->
    <path d="M724 784 H784 V724"/>
  </g>

  <!-- Crosshair Pointer Ticks -->
  <g stroke="url(#mark)" stroke-width="38" stroke-linecap="round">
    <line x1="512" y1="184" x2="512" y2="236"/>
    <line x1="512" y1="788" x2="512" y2="840"/>
    <line x1="184" y1="512" x2="236" y2="512"/>
    <line x1="788" y1="512" x2="840" y2="512"/>
  </g>

  <!-- Real-Time Voice Intelligence / Audio Coaching Pulse Bars (Center) -->
  <g fill="url(#mark)">
    <!-- Bar 1 -->
    <rect x="362" y="440" width="36" height="144" rx="18"/>
    <!-- Bar 2 -->
    <rect x="422" y="370" width="36" height="284" rx="18"/>
    <!-- Bar 3 (Center Hunter Pulse) -->
    <rect x="482" y="300" width="60" height="424" rx="30" filter="url(#glow)"/>
    <!-- Bar 4 -->
    <rect x="566" y="370" width="36" height="284" rx="18"/>
    <!-- Bar 5 -->
    <rect x="626" y="440" width="36" height="144" rx="18"/>
  </g>

  <!-- Precision Center Target Beacon -->
  <circle cx="512" cy="512" r="14" fill="#ffffff"/>
</svg>
